name: Publish to CocoaPods

on:
  push:
    branches:
      - main
    paths:
      - 'TPStreamsSDK.podspec'
      - 'CHANGELOG.md'
  workflow_dispatch:

concurrency:
  group: publish-cocoapods
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: Publish Pod & Tag
    runs-on: macos-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from podspec
        id: version
        run: |
          VERSION=$(ruby -e 'puts File.read("TPStreamsSDK.podspec")[/spec\.version\s*=\s*["\x27]([^"\x27]+)/, 1]')
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "Error: Invalid or missing version in TPStreamsSDK.podspec: '$VERSION'" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Check git tag and CocoaPods status
        id: release_check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git fetch --tags
          tag_exists=false
          if git rev-parse --verify --quiet "refs/tags/$VERSION"; then
            tag_exists=true
          fi

          # Check if version is already published on CocoaPods
          pod_published=false
          if pod trunk info TPStreamsSDK 2>/dev/null | grep -qE "^\s*-\s*${VERSION}\s+\("; then
            pod_published=true
          fi

          if [ "$pod_published" = "true" ]; then
            echo "Version $VERSION is already published on CocoaPods. Skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            if [ "$tag_exists" = "true" ]; then
              echo "Tag $VERSION already exists locally/remotely, but is not yet published on CocoaPods. Proceeding to publish."
            else
              echo "Version $VERSION is not yet tagged or published. Proceeding to tag and publish."
            fi
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push Git tag
        if: steps.release_check.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! git rev-parse --verify --quiet "refs/tags/$VERSION"; then
            echo "Creating and pushing tag $VERSION..."
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$VERSION" -m "Release $VERSION"
            git push origin "refs/tags/$VERSION"
            sleep 3
          else
            echo "Tag $VERSION already present."
          fi

      - name: Set up CocoaPods
        if: steps.release_check.outputs.skip != 'true'
        run: |
          gem install cocoapods
          pod setup

      - name: Publish to CocoaPods
        if: steps.release_check.outputs.skip != 'true'
        run: pod trunk push TPStreamsSDK.podspec --allow-warnings
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
