name: Create GitHub Release

on:
  workflow_run:
    workflows: ["Publish to CocoaPods"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (leave blank to read from TPStreamsSDK.podspec)"
        required: false
        default: ""

concurrency:
  group: create-github-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release version
        id: version
        shell: bash
        run: |
          git fetch --tags
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=$(ruby -e 'puts File.read("TPStreamsSDK.podspec")[/spec\.version\s*=\s*["\x27]([^"\x27]+)/, 1]')
          fi

          if [ -z "$VERSION" ]; then
            echo "Error: Could not determine release version" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Target version: $VERSION"

      - name: Check if release already exists
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            if [ "${{ github.event_name }}" = "workflow_run" ]; then
              echo "Release $VERSION already exists. Skipping creation."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              echo "Release $VERSION already exists. Will update notes."
              echo "skip=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Release $VERSION does not exist yet."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes from CHANGELOG.md
        if: steps.check_release.outputs.skip != 'true'
        id: changelog
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          python3 -c "
          import re, sys
          v = '${VERSION}'.lstrip('v')
          with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
              content = f.read()
          pattern = rf'^##\s+(?:\[)?v?{re.escape(v)}(?:\])?(?:\s*-\s*[^\n]*)?\n(.*?)(?=\n##\s+|\Z)'
          match = re.search(pattern, content, re.MULTILINE | re.DOTALL)
          notes = match.group(1).strip() if (match and match.group(1).strip()) else f'Release {v}'
          with open('release_notes.md', 'w', encoding='utf-8') as out:
              out.write(notes + '\n')
          "
          echo "=== Extracted Release Notes ==="
          cat release_notes.md
          echo "==============================="

      - name: Create or update GitHub Release
        if: steps.check_release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Updating GitHub Release for $VERSION..."
            gh release edit "$VERSION" \
              --title "$VERSION" \
              --notes-file release_notes.md
          else
            echo "Creating GitHub Release for $VERSION..."
            gh release create "$VERSION" \
              --title "$VERSION" \
              --notes-file release_notes.md
          fi
