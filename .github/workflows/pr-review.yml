
name: PR Review with Progress Tracking

# Docs:    https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
# Example: https://github.com/anthropics/claude-code-action/blob/main/examples/pr-review-comprehensive.yml

on:
  pull_request:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  review-with-tracking:
    if: |
      github.actor != 'claude[bot]' &&
      github.actor != 'github-actions[bot]' &&
      (
        (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && contains(github.event.comment.body, '@claude review'))
      )
    runs-on: ubuntu-latest
    concurrency:
      group: pr-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: PR Review with Progress Tracking
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          track_progress: true

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

            Review this PR for the **TPStreams iOS Player SDK** (AVPlayer-based, FairPlay DRM, offline downloads, UIKit/SwiftUI, CocoaPods + SPM).

            **Code Quality**
            - Meaningful naming, single-responsibility types, no force-unwrap (`!`) on lifecycle-sensitive objects
            - `[weak self]` in all closures to avoid retain cycles
            - Use `TPStreamPlayerError` consistently; no raw error strings or silent failures

            **Resource Lifecycle**
            - KVO and time observers must be stored and removed in `deinit`
            - Clean up `AVPlayerItem` observations and `StreamSubscription`s on dispose
            - Realm objects must stay on the correct thread; increment schema version for model changes

            **Public API & Backward Compatibility**
            - No breaking changes to `public`/`open` types without a major version bump
            - `#if SPM` / `#elseif CocoaPods` guards must be correct for both distribution paths
            - `TPStreamPlayerConfiguration` changes must stay backward-compatible

            **Security**
            - Access tokens must never appear in logs or Sentry events
            - DRM keys must not be exposed outside `ContentKeyDelegate` / `AVContentKeySession`

            Use inline comments for line-level issues, top-level comments for architectural observations.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

